<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Management Control</title>
    <link rel="stylesheet" href="/styles.css?v=project-portal-1" />
    <link rel="stylesheet" href="/restored.css?v=layout-2" />
    <link rel="stylesheet" href="/admin.css?v=layout-2" />
    <link rel="stylesheet" href="/modal.css?v=layout-2" />
    <link rel="stylesheet" href="/layout.css?v=layout-3" />
    <link rel="stylesheet" href="/buttons.css?v=project-portal-1" />
    <link rel="stylesheet" href="/workload-controls.css?v=workload-controls-3" />
    <link rel="stylesheet" href="/timeline.css?v=timeline-2" />
  </head>
  <body>
    <div class="shell">
      <aside>
        <div class="brand"><span class="brand-mark">PM</span><span class="brand-name">Project Management<br><span class="light">Control</span></span></div>
        <nav>
          <button class="nav" data-page="dashboard">Overview</button>
          <button class="nav" data-page="project-control">Project portal</button>
          <button class="nav" data-page="tasks">Work items</button>
          <button class="nav" data-page="portal">Project portal setup</button>
          <!-- Temporarily hidden: weekly updates remain available from the project workflow. -->
          <button class="nav" data-page="weekly-portal" hidden>Weekly Portal</button>
          <button class="nav" data-page="audit">Activity log</button>
        </nav>
        <div class="demo-user"><div class="avatar">PM</div><div><strong>RRMS Demo PM</strong><small>Single-user demo mode</small></div></div>
      </aside>
      <main>
        <header><div><p class="eyebrow">PROJECT CONTROL / SINGLE-USER WALKTHROUGH</p><h1 id="page-title">Project overview</h1></div><button class="primary" id="quick-action">+ Add weekly update</button></header>
        <section id="content" aria-live="polite"></section>
      </main>
    </div>
    <dialog id="modal" aria-modal="true"><form method="dialog" id="modal-form"><button class="close" type="button" data-close-modal aria-label="Close modal">×</button><div id="modal-content"></div></form></dialog>
    <div class="toast" id="toast"></div>
    <script type="module" src="/app.js?v=project-portal-3"></script>
  </body>
</html>
