services:
  - type: web
    name: lean-project-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_PROVIDER
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: API_SECRET_KEY
        generateValue: true
      - key: ALLOW_DEMO_IDENTITY_OVERRIDE
        value: "false"
